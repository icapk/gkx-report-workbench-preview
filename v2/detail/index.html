<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>报告详情 · 智能创作报告</title>
  <link rel="icon" href="../assets/portal-brand.png">
  <link rel="stylesheet" href="layout.css?v=c0209d6eae04">
  <link rel="stylesheet" href="process-history.css?v=39767ab51e20">
  <link rel="stylesheet" href="report-actions.css?v=0c7db3e26fca">
  <script defer src="process-history.js?v=3f927d03b2f8"></script>
  <script defer src="report-actions.js?v=6bda18acfe97"></script>
  <link rel="stylesheet" href="trace-view.css?v=9a381e0eb93d">
  <link rel="stylesheet" href="trace-workspace.css?v=16d5340ee26e">
  <script defer src="trace-model.js?v=8c914d935681"></script>
  <script defer src="trace-view.js?v=3becdcfedeb7"></script>
  <script defer src="trace-workspace.js?v=9f508e4ac620"></script>
  <link rel="stylesheet" href="judgement-studio.css?v=65c3b4448b53">
  <link rel="stylesheet" href="judgement-workspace.css?v=b8c7442ca4aa">
  <script defer src="judgement-cases.js?v=55f7dc74b8a9"></script>
  <script defer src="judgement-studio.js?v=41865e5b2f9f"></script>
  <script defer src="judgement-workspace.js?v=7e6a7bcbc29f"></script>
  <link rel="stylesheet" href="../assets/research-flow.css?v=126123b9aa34">
  <script type="module" src="workspace.js?v=4351206d6857"></script>
</head>
<body>
  <main class="workspace">
    <section class="report-surface" id="detail" hidden aria-label="报告写作工作区">
      <section class="conversation" aria-label="报告研判与写作过程">
        <div class="judgement-mode" id="judgement-mode" role="group" aria-label="查看报告过程">
          <button type="button" data-judgement-view="review" aria-controls="judgement-left-slot" aria-pressed="true">研判回放</button>
          <button type="button" data-judgement-view="process" aria-controls="process-content" aria-pressed="false">写作过程</button>
        </div>
        <div id="judgement-left-slot"><div id="judgement-host" tabindex="-1"></div></div>
        <div id="process-content" class="conversation-content"></div>
      </section>
      <section class="document-pane" id="document-pane" aria-label="报告阅读区">
        <div class="tool-row">
          <div class="report-tools" id="report-tools" role="toolbar" aria-label="报告工具栏">
            <button data-action="toc" aria-expanded="true" aria-controls="toc"><i data-icon="list"></i>目录</button>
            <button type="button" id="open-report-trace" aria-haspopup="dialog"><i data-icon="trace"></i>数据溯源</button>
            <button type="button" id="compact-judgement-link" aria-controls="judgement-host">研判回放</button>
            <button data-action="copy"><i data-icon="copy"></i>复制</button>
            <button data-action="download" aria-haspopup="true"><i data-icon="download"></i>下载</button>
            <span class="tool-sep"></span>
            <button data-action="new-version"><i data-icon="plus"></i>新建版本</button>
            <button data-action="versions"><i data-icon="history"></i>版本管理</button>
            <span class="tool-sep"></span>
            <button data-action="knowledge"><i data-icon="upload"></i>保存至知识库</button>
          </div>
          <button class="icon-btn" id="close-report" type="button" aria-label="关闭报告" title="关闭报告"><i data-icon="close"></i></button>
        </div>
        <div class="reading-layout" id="reading-layout">
          <aside class="toc" id="toc" aria-label="报告目录">
            <div class="toc-heading"><strong>目录</strong><button class="icon-btn" id="close-toc" aria-label="收起目录"><i data-icon="panel-close"></i></button></div>
            <nav id="toc-items" aria-label="定位到章节"></nav>
          </aside>
          <div class="reader" id="reader">
            <div id="trace-summary" aria-label="报告数据溯源"></div>
            <div id="judgement-mobile" hidden><button type="button" id="jump-to-editor">阅读报告正文 ↓</button></div>
            <div class="paper">
              <div id="trace-pins"></div>
              <article class="report-text" id="editor" contenteditable="true" role="textbox" aria-label="报告正文" aria-multiline="true" spellcheck="false"></article>
              <section class="references" id="references" hidden aria-label="数据来源与参考文献">
                <h2>数据来源与参考文献</h2>
                <h3 id="source-count"></h3>
                <ol id="sources"></ol>
              </section>
            </div>
          </div>
        </div>
      </section>
    </section>
    <section id="unavailable" class="detail-unavailable" hidden><h1>暂时无法打开这份报告</h1><p id="unavailable-message">请返回工作台，从所属会话打开已生成的报告。</p><button type="button" id="return-home">返回工作台</button></section>
  </main>
</body>
</html>
